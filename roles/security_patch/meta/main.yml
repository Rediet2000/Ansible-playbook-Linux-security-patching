galaxy_info:
  role_name: security_patch
  author: Platform Engineering
  description: >-
    Applies security-only package updates to Debian and Ubuntu hosts, reports
    pending reboots and stale services, and never reboots on its own.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions: [focal, jammy, noble]
    - name: Debian
      versions: [bullseye, bookworm, trixie]
  galaxy_tags: [security, patching, apt, debian, ubuntu]
dependencies: []
