[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
interpreter_python   = auto_silent
host_key_checking    = True
forks                = 20
timeout              = 30
retry_files_enabled  = False
display_skipped_hosts = False
# These two callbacks live in ansible.posix (see requirements.yml).
callbacks_enabled    = ansible.posix.profile_tasks, ansible.posix.timer
callback_result_format = yaml
# Patch runs are long; keep the fact cache out of the way but log everything.
log_path             = logs/ansible.log

[ssh_connection]
pipelining = True
# NOTE: `HostKeyAlgorithms=+ssh-rsa` re-enables the legacy SHA-1 host-key
# algorithm because these hosts still present ssh-rsa host keys and modern
# OpenSSH (8.8+) rejects it by default. This is a temporary compatibility
# shim -- the real fix is to regenerate the servers' host keys (ed25519 /
# rsa-sha2) so this can be removed.
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o HostKeyAlgorithms=+ssh-rsa

[privilege_escalation]
become        = False
become_method = sudo
