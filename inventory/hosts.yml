---
# Fleet inventory for security patching.
#
# The playbook uses `order: inventory` with `serial: [1, "25%"]`, so THE FIRST
# HOST LISTED IN THE TARGET GROUP IS THE CANARY. Put a low-risk host first.
all:
  children:
    # The control node is listed explicitly so that it inherits
    # group_vars/all.yml; the implicit localhost would not. Note that this puts
    # localhost in the `all` group -- always target `linux`, never `all`.
    control:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
          ansible_become: false

    linux:
      children:
        ubuntu:
          hosts:
            # canary first
            127.0.0204:
            127.0.0205:
            127.0.0210:
            127.0.0211:
            127.0.0212:
        debian:
          hosts:
            127.0.0210:
              # Never let a patch run touch the database engine unattended.
              patch_exclude_packages:
                - postgresql-18
                - postgresql-client-18
            127.0.0211:
              # Never let a patch run touch the database engine unattended.
              patch_exclude_packages:
                - postgresql-18
                - postgresql-client-18
            127.0.0212:
              # Never let a patch run touch the database engine unattended.
              patch_exclude_packages:
                - postgresql-18
                - postgresql-client-18
      vars:
        ansible_user: hagbes
        ansible_become: true
        ansible_become_method: sudo
